<div class="container text-center">
    <div class="display-6">
        Cadastrar Cliente:
    </div>
    <div class="border rounded shadow-sm p-4">
        <form [formGroup]="clientForm" #ngClientForm="ngForm">
            <div class="row">
                <div class="col-9 m-auto">
                    <div class="mb-3">
                        <label for="name" class="form-label">Nome: </label>
                        <input type="name" class="form-control" id="name" placeholder="Nome" formControlName="name">
                        @if (ngClientForm.submitted){
                        <div class="text-danger text-start">
                            @if (cfName?.errors?.['required']){
                            <small><sup>*</sup>O nome é obrigatório</small>
                            }
                        </div>
                        }
                    </div>
                </div>
            </div>
            <div class="row">
                <div class="col-9 m-auto">

                    <div class="row">
                        <div class="col-6">
                            <div class="mb-3">
                                <label for="cpf" class="form-label">CPF: </label>
                                <input type="text" class="form-control" id="cpf" placeholder="CPF"
                                    formControlName="cpf">
                                @if (ngClientForm.submitted){
                                <div class="text-danger text-start">
                                    @if (cfCpf?.errors?.['required']){
                                    <small><sup>*</sup>O CPF é obrigatório</small>
                                    }
                                </div>
                                }
                            </div>
                        </div>

                        <div class="col-6">
                            <div class="mb-3">
                                <label for="phone" class="form-label">Telefone: </label>
                                <input type="text" class="form-control" id="phone" placeholder="Telefone"
                                    formControlName="phone">
                                @if (ngClientForm.submitted) {
                                <div class="text-danger text-start">
                                    @if (cfPhone?.errors?.['required']){
                                    <small><sup>*</sup>O telefone é obrigatório</small>
                                    }
                                </div>
                                }
                            </div>
                        </div>

                    </div>


                </div>
            </div>
            <div class="mb-3 text-end">
                <button class="btn btn-secondary me-1" (click)="cancel()">Cancelar</button>
                <button class="btn btn-primary" [disabled]="!clientForm.dirty" (click)="save()">Salvar</button>
            </div>


        </form>
    </div>
</div>
